spring.application.name=job-tracking

server.port=8080

# --- DB (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost/job_tracking
spring.datasource.username=job_user
spring.datasource.password=job_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Initialize schema (safe, no DROP)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-postgres.sql
spring.sql.init.continue-on-error=true

# Best-offer scheduler settings (fixedDelay in ms)
job.best-offer.fixed-delay-ms=60000
job.best-offer.initial-delay-ms=0
